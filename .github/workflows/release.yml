name: release

# Binaries are built here, never on a developer machine: the attestation
# ties every file to this repository, this workflow and the tagged commit.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test -timeout 120s ./...
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/dpiprobe.exe ./cmd/dpiprobe
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/dpiprobe-linux-amd64 ./cmd/dpiprobe
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/dpiprobe-macos-arm64 ./cmd/dpiprobe
          cd dist && sha256sum dpiprobe* > SHA256SUMS.txt
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'dist/dpiprobe*'
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            cat <<'EOF'
          Скачайте `dpiprobe.exe`, **выключите VPN** и запустите двойным кликом. Через 3–5 минут отчёт сохранится рядом с exe (`.txt` и `.json`).

          Проверяет: подмену и перехват DNS, какой зашифрованный DNS (DoH/DoT) у вас работает и не врёт, сайты по HTTP и TLS с разбором причины (DPI по SNI / блок по IP / связка), обрыв соединений после 16–20 КБ к ~110 адресам хостингов и CDN с подбором белых SNI, доступность Telegram по протоколу MTProto.

          **Файлы собраны GitHub Actions из этого коммита, а не на чьём-то компьютере.** Проверить:

          ```
          gh attestation verify dpiprobe.exe --repo sovereignbrains/dpiprobe
          ```

          SHA-256:

          ```
          EOF
            cat dist/SHA256SUMS.txt
            echo '```'
          } | sed 's/^          //' > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "dpiprobe ${TAG#v}" --notes-file notes.md
          fi
